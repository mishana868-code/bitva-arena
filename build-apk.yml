name: Build Bitva Arena APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p BitvaArenaAndroid assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Bitva-Arena-APK
          path: BitvaArenaAndroid/app/build/outputs/apk/debug/app-debug.apk
