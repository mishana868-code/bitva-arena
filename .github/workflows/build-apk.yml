
name: Build Bitva Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          test -d unpacked/BitvaArenaAndroid

      - name: Build APK
        run: gradle -p unpacked/BitvaArenaAndroid assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitva-Arena-APK
          path: unpacked/BitvaArenaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
